# ── Terminal & colors ──
set -g default-terminal "tmux-256color"
set -g default-shell /usr/bin/fish
set -ag terminal-overrides ",xterm-256color:RGB"

# ── General ──
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
set -g remain-on-exit off
set -g destroy-unattached off
set -g detach-on-destroy on

# ============================================================================
# Prefix: Ctrl+A (dùng được trên Mac + Termux + Android)
# ============================================================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- Claude theme (backup: tmux.conf.bak-tokyonight) ----
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#151515,fg=#c5c5c3"
set -g status-left-length 40
set -g status-left "#[fg=#d97757,bg=#151515]#[fg=#151515,bg=#d97757,bold]#S#[fg=#d97757,bg=#151515,nobold] "
set -g status-right "#(/home/samsa/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{?client_prefix,#[fg=#d97757 bold]PREFIX ,}#(~/.config/tmux/claude-quota.sh)#[fg=#2a2a2a,bg=#151515]#[bg=#2a2a2a]#(~/.config/tmux/sysmon.sh)#[fg=#2a2a2a,bg=#151515]"
set -g status-right-length 140

# 3-line status: line 0 = thin top border, line 1 = default status, line 2 = thin bottom border
set -g status 3
set -gu status-format
run-shell 'tmux set -g "status-format[1]" "$(tmux show -gv "status-format[0]")"; line="#[fg=#313131]$(printf "%.0s─" $(seq 500))"; tmux set -g "status-format[0]" "$line"; tmux set -g "status-format[2]" "$line"'

setw -g window-status-format "#[fg=#878785]  #I #W  "
setw -g window-status-current-format " #[fg=#2a2a2a,bg=#151515]#[fg=#eeeeec,bg=#2a2a2a,bold]#I #W#[fg=#2a2a2a,bg=#151515,nobold]"
setw -g window-status-separator ""

set -g pane-border-style "fg=#313131"
set -g pane-active-border-style "fg=#d97757"
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#d97757 bold],#[fg=#878785]} #P #{pane_current_command} #[default]"
set -g popup-border-style "fg=#878785"
set -g popup-border-lines rounded
set -g message-style "bg=#212121,fg=#eeeeec"
set -g message-command-style "bg=#212121,fg=#d97757"
set -g mode-style "bg=#3a3a3a,fg=#eeeeec"
set -g display-panes-active-colour "#d97757"
set -g display-panes-colour "#878785"
setw -g clock-mode-colour "#d97757"

# ── Copy / scroll mode (vi) ──
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ── Vim-style keybindings ──

# splits: v = vertical (like :vsp), h = horizontal (like :sp)
bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"

# navigate panes: prefix + Ctrl-hjkl
bind-key -r C-h select-pane -L
bind-key -r C-j select-pane -D
bind-key -r C-k select-pane -U
bind-key -r C-l select-pane -R

# resize panes: prefix + HJKL
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# prefix+x: kill pane (no confirm)
bind-key x kill-pane

# prefix+X: kill window
bind-key X kill-window

# prefix+N: new session (prompts for name)
bind-key N command-prompt -p "new session:" "new-session -d -s '%1' \; switch-client -t '%1'"

# prefix+s: session tree as floating popup
bind-key s display-popup -E -w 80% -h 80% "tmux choose-tree -Zs"

# prefix+g: sesh picker via fzf (Ctrl+d kills session, Ctrl+r renames)
bind-key "g" display-popup -E -w 80% -h 70% -T " Enter connect │ Ctrl+d kill │ Ctrl+r rename │ Esc close" "$HOME/.local/bin/tmux-sesh-picker"

# prefix+/: search in scrollback
bind-key "/" copy-mode \; send-keys "/"

# prefix+?: interactive cheat sheet (press key to execute)
bind-key "?" display-popup -E -w 60 -h 32 -T " ⌨  Shortcuts " "$HOME/.local/bin/tmux-cheatsheet"

# ============================================================================
# Window navigation — Prefix + p/n, Alt+h/l (không prefix)
# ============================================================================
bind -n M-h previous-window
bind -n M-l next-window
bind p previous-window
bind n next-window

# ============================================================================
# Reload config — Prefix + r
# ============================================================================
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded ✓"

# ============================================================================
# List of plugins
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
# giữ nguyên prefix+C-l = select-pane -R (không cho plugin đổi thành clear-screen)
set -g @vim_navigator_prefix_mapping_clear_screen ''
set -g @plugin 'tmux-plugins/tmux-yank'

# Save/restore tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Auto save + auto restore
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
# continuum tự tắt auto-save khi thấy tmux client mồ côi (nó tưởng là server khác),
# nên save hook được gắn cứng vào status-right ở trên.

# Claude: hook SessionStart ghi @claude-sid vào pane -> post-save đổi thành `claude --resume <id>`
set -g @resurrect-processes '"~claude" "~9router" "~genesis.web"'
set -g @resurrect-hook-post-save-layout '~/.config/tmux/claude-resurrect-hook.sh'

# Browse/resume Claude sessions — Prefix + C (g is taken by sesh picker)
set -g @plugin 'aomerk/tmux-claude-sessions'
set -g @claude_sessions_key 'C'

# View listening ports / kill / tunnel — Prefix + t
set -g @plugin 'fiqryq/port'
set -g @port_bind 't'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# prefix+1..9: animated window switch (tmux_pane_animations, cargo install)
# ponytail: 0.1.0 crate; if it dies mid-animation, status bar stays frozen -> prefix+r to reload
run-shell 'for i in 1 2 3 4 5 6 7 8 9; do tmux bind-key $i run-shell "$HOME/.cargo/bin/tmux_animate --animation sweep -t $i"; done'
